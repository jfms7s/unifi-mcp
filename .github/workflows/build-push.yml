name: Build and push image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      # Production dependencies only: a dev-tool advisory shouldn't block a release.
      - run: npm audit --omit=dev --audit-level=high

      # eng-metrics-lab: the test run itself writes the lcov, so the tests run once.
      - name: Test with coverage (eng-metrics-lab)
        run: npm run test:coverage

      - run: npm run build

      # Only reached when every step above passed, so a red test leaves no fragment.
      - name: Collect coverage fragment (eng-metrics-lab)
        run: |
          mkdir -p .quality
          mv coverage/lcov.info .quality/coverage-ts.lcov

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-fragments-ts
          path: .quality/coverage-ts.lcov
          include-hidden-files: true
          retention-days: 7

  # eng-metrics-lab (report-only): duplication, complexity, dead code and coverage; the
  # collector picks up the quality-report artifact. Runs on a red test job too (coverage is
  # then null) so the report is still published.
  quality:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: quality-fragments-*
          merge-multiple: true
          path: .quality
        continue-on-error: true
      - name: Code quality (report-only)
        uses: jfms7s/eng-metrics-lab/action@961b196f18ec58c1fc42cdd0e7e000094a39f545 # v0.4.0
        continue-on-error: true

  build-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Only this job pushes to GHCR; the test job (and PR runs) keep a read-only token.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The cluster runs both arm64 (Pis) and amd64 nodes. Deployments pin the
      # vX.Y.Z tag, never `latest`: with IfNotPresent a floating tag can't tell
      # a node that cached an older build from one that hasn't.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/unifi-mcp:latest
            ghcr.io/${{ github.repository_owner }}/unifi-mcp:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/unifi-mcp:{1}', github.repository_owner, github.ref_name) || '' }}
